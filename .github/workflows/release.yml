name: release-abi
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: 下载 ABI 依赖
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: ./ci/deps.sh
      - name: 构建
        run: make build
      - name: 打包 ABI 产物
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME}"
          d="slotsboxmalloc-abi-$v-linux-x86_64"
          # 本库是 header-only（#define SLOTSBOXMALLOC_IMPLEMENTATION 单头文件）：
          # 只发头，不发 .so —— 消费者把实现体编进自己的 TU。
          mkdir -p "$d/include"
          cp -R include/. "$d/include/"
          # 本仓无可执行产物（纯库），故不带 bin/
          printf '{"abi":"%s"}\n' "$v" > "$d/abi-manifest.json"
          tar czf "$d.tar.gz" "$d"
          tar tzf "$d.tar.gz"
          sha256sum "$d.tar.gz" > SHA256SUMS
      - name: 发布 release
        run: gh release create "${GITHUB_REF_NAME}" slotsboxmalloc-abi-*.tar.gz SHA256SUMS --generate-notes
